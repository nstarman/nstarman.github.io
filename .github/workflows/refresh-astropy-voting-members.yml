name: Refresh Astropy voting members

# Astropy publishes its active voting members on its public team page. Keep a
# reviewed snapshot here: the site remains reproducible, while this annual job
# detects changes without querying Astropy during a site build.
on:
  schedule:
    # 1 September at 06:30 UTC, before the annual collaborator refresh at 07:00.
    - cron: "30 6 1 9 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-astropy-voting-members
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      BRANCH: chore/refresh-astropy-voting-members
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      - name: Scrape the Astropy team page
        run: node scripts/scrape-astropy-voting-members.mjs

      - name: Verify the snapshot
        run: npm test

      - name: Open a pull request if the membership changed
        run: |
          if git diff --quiet -- config/astropy-voting-members.json; then
            echo "Astropy voting membership is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          scripts/open-refresh-pr.sh "$BRANCH" "Refresh Astropy voting members ($(date -u +%Y))" \
            "Updated from https://www.astropy.org/team by the annual refresh workflow." \
            config/astropy-voting-members.json
