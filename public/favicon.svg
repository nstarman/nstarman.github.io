<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1659 1659">
  <!-- Bold serif NS with the accent bar. The letterforms are outlines cut from
       NewCM10-Bold, the CV's own face, rather than <text>: a favicon cannot
       rely on a font being installed, and paths render identically everywhere.

       Laid out and scaled by the glyphs' ink rather than their advance widths.
       The advances carry ~40 and ~64 units of side bearing that would otherwise
       be padding inside a 16px square, which is where the mark can least afford
       it. Both colours flip for dark tabs. -->
  <style>
    .ink { fill: #12161C }
    .bar { fill: #2A5DA8 }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E5E9F0 }
      .bar { fill: #84AEEC }
    }
  </style>
  <g transform="translate(15 1172.5) scale(1 -1)">
